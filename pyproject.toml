[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "glioma-recurrence-risk"
version = "0.1.0"
description = "Research pipeline for voxelwise glioma recurrence-risk prediction from post-treatment MRI."
readme = "README.md"
requires-python = ">=3.11,<3.15"
license = { text = "MIT" }
authors = [{ name = "Agent-generated research scaffold" }]
dependencies = [
  "numpy>=1.26",
  "scipy>=1.11",
  "nibabel>=5.2",
  "scikit-learn>=1.4",
  "matplotlib>=3.8",
  "simpleitk>=2.3",
]

[project.optional-dependencies]
deep = [
  "monai>=1.3",
  "torch>=2.2",
]
dev = [
  "pytest>=8.0",
]

[project.scripts]
glioma-risk = "glioma_recurrence.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/glioma_recurrence"]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]
